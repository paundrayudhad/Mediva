<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Smart Emergency Ambulance — UX Wireframe</title>
<style>
:root{
  --bg:#f5f5f5;--card:#fff;--text:#171717;--muted:#666;--line:#d8d8d8;--dark:#202020;--soft:#ececec;
}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}.app{display:grid;grid-template-columns:280px minmax(320px,1fr);min-height:100vh}
.sidebar{border-right:1px solid var(--line);background:#fff;padding:22px;position:sticky;top:0;height:100vh;overflow:auto}
.sidebar h1{font-size:19px;margin:0 0 6px}.sidebar p{font-size:12px;color:var(--muted);line-height:1.5}.role-btn{width:100%;text-align:left;margin:5px 0;padding:10px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}.role-btn.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.flow-list{margin-top:18px}.flow-item{display:block;width:100%;padding:9px 8px;border:0;background:transparent;text-align:left;font-size:13px;border-bottom:1px solid #eee;cursor:pointer}.flow-item.active{font-weight:700;background:#f2f2f2}
.main{padding:28px}.toolbar{max-width:1050px;margin:0 auto 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.toolbar h2{margin:0;font-size:20px}.tag{padding:5px 9px;border:1px solid var(--line);border-radius:999px;font-size:12px;background:#fff}
.stage{max-width:1050px;margin:auto;display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:28px;align-items:start}.phone{width:100%;max-width:390px;margin:auto;border:2px solid #222;border-radius:28px;background:#fff;min-height:760px;overflow:hidden;box-shadow:0 10px 35px rgba(0,0,0,.08)}.statusbar{height:28px;padding:7px 18px 0;font-size:11px;display:flex;justify-content:space-between}.screen{padding:18px 18px 26px}.screen h3{font-size:22px;margin:4px 0 8px}.screen .sub{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:18px}.card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;background:#fff}.soft{background:#f7f7f7}.label{font-size:12px;color:var(--muted);margin-bottom:5px}.value{font-size:14px;font-weight:700}.big-cta,.secondary{width:100%;padding:14px;border-radius:10px;cursor:pointer;margin-top:10px}.big-cta{background:#171717;color:#fff;border:1px solid #171717;font-weight:700}.secondary{background:#fff;border:1px solid var(--line)}.danger{border:2px solid #171717;padding:18px;text-align:center;font-size:18px;font-weight:700}.choice{display:block;width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left;margin:8px 0;cursor:pointer}.choice:hover{background:#f4f4f4}.choice.selected{background:#e9e9e9;border-color:#333}.row{display:flex;gap:8px}.row>*{flex:1}.input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;margin:6px 0 12px;background:white}.map{height:260px;border:1px dashed #777;border-radius:12px;background:repeating-linear-gradient(45deg,#fafafa,#fafafa 10px,#f2f2f2 10px,#f2f2f2 20px);display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;color:#555;margin:12px 0}.progress{display:flex;gap:9px;align-items:flex-start;margin:12px 0}.dot{width:18px;height:18px;border-radius:50%;border:1px solid #555;display:flex;align-items:center;justify-content:center;font-size:10px;flex:none}.done .dot{background:#222;color:#fff}.progress .txt{font-size:13px}.muted{color:var(--muted)}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:11px;margin:2px}.note{border-left:3px solid #222;padding:10px 12px;background:#f7f7f7;font-size:12px;line-height:1.5}.spec{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.spec h3{margin:0 0 10px;font-size:18px}.spec h4{font-size:13px;margin:18px 0 8px}.spec p,.spec li{font-size:13px;line-height:1.55;color:#444}.nav{display:flex;gap:8px;margin-top:18px}.nav button{padding:10px 14px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}.nav button.primary{background:#222;color:#fff;border-color:#222}.section-title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#777;margin-top:18px}.timeline{font-size:12px;line-height:1.8}.kv{display:grid;grid-template-columns:110px 1fr;gap:5px;font-size:12px}.checkbox{display:flex;gap:8px;align-items:center;border:1px solid var(--line);padding:10px;border-radius:8px;margin:7px 0}.topback{font-size:13px;margin-bottom:14px}.alert{border:1px solid #777;padding:12px;border-radius:10px;font-size:13px;background:#fafafa}.hero-number{font-size:36px;font-weight:700;margin:6px 0}.hidden{display:none!important}
@media(max-width:850px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.stage{grid-template-columns:1fr}.spec{max-width:390px;margin:auto}.main{padding:18px}.toolbar{max-width:390px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h1>Smart Emergency Ambulance</h1>
    <p>Wireframe UX hackathon. Semua role menggunakan mobile app. Gunakan role dan flow di bawah untuk berpindah layar.</p>
    <div class="section-title">Role</div>
    <button class="role-btn active" data-role="user">User / Penolong</button>
    <button class="role-btn" data-role="ambulance">Petugas Ambulans</button>
    <button class="role-btn" data-role="hospital">Petugas Rumah Sakit</button>
    <div class="section-title">Flow</div>
    <div id="flowList" class="flow-list"></div>
  </aside>
  <main class="main">
    <div class="toolbar">
      <div><h2 id="screenTitle">Home</h2><span class="tag" id="roleTag">User / Penolong</span></div>
      <span class="tag">Low-fidelity UX</span>
    </div>
    <div class="stage">
      <div>
        <div class="phone">
          <div class="statusbar"><span>21:42</span><span>4G • 87%</span></div>
          <div id="phoneScreen" class="screen"></div>
        </div>
        <div class="nav">
          <button id="prevBtn">← Sebelumnya</button>
          <button id="nextBtn" class="primary">Berikutnya →</button>
        </div>
      </div>
      <section id="specPanel" class="spec"></section>
    </div>
  </main>
</div>
<script>
const flows={
user:[
{id:'u-home',title:'Home / Emergency CTA',html:`<h3>Butuh bantuan darurat?</h3><p class="sub">Panggil ambulans dan kami bantu mencarikan unit yang sesuai dengan kondisi korban.</p><div class="danger">PANGGIL AMBULANS</div><div class="card soft"><div class="label">Lokasi Anda</div><div class="value">📍 Jl. Contoh Raya, Surakarta</div></div><button class="secondary">Riwayat Bantuan</button>`,spec:`<h3>Home / Emergency CTA</h3><p>Tujuan: memberikan satu aksi utama yang sangat jelas.</p><h4>User input</h4><ul><li>Tidak ada input wajib.</li></ul><h4>UX rule</h4><ul><li>CTA emergency harus menjadi elemen paling dominan.</li><li>Jangan penuhi home dengan menu non-esensial.</li></ul>`},
{id:'u-location',title:'Konfirmasi Lokasi',html:`<div class="topback">← Kembali</div><h3>Lokasi kejadian</h3><p class="sub">Pastikan titik ini adalah lokasi korban saat ini.</p><div class="map">MAP / PIN LOKASI<br>Geser pin jika lokasi kurang tepat</div><label class="label">Alamat</label><input class="input" value="Jl. Contoh Raya No. 10, Surakarta"><label class="label">Patokan lokasi (opsional)</label><input class="input" placeholder="Contoh: depan minimarket"><label class="label">Catatan akses (opsional)</label><textarea class="input" rows="3" placeholder="Contoh: masuk gang sebelah masjid"></textarea><button class="big-cta">Lokasi Sudah Benar</button>`,spec:`<h3>Konfirmasi Lokasi</h3><h4>Input wajib</h4><ul><li>Latitude & longitude.</li><li>Alamat/titik lokasi.</li></ul><h4>Input opsional</h4><ul><li>Patokan.</li><li>Catatan akses.</li></ul><p>Jika GPS gagal, user dapat memasukkan lokasi manual dan menggeser pin.</p>`},
{id:'u-incident',title:'Jenis Kejadian',html:`<div class="topback">← Kembali</div><h3>Apa yang terjadi?</h3><p class="sub">Pilih kondisi yang paling mendekati. Anda tidak perlu mengetahui istilah medis.</p>${['🚗 Kecelakaan','🧠 Tidak sadarkan diri','🫁 Sulit bernapas','❤️ Nyeri dada','🩸 Pendarahan','🤰 Persalinan','🔥 Luka bakar','＋ Lainnya'].map(x=>`<button class="choice">${x}</button>`).join('')}`,spec:`<h3>Jenis Kejadian</h3><h4>Input wajib</h4><ul><li>Satu jenis kejadian.</li></ul><h4>Jika memilih Lainnya</h4><ul><li>Deskripsi singkat maksimal 200 karakter.</li></ul><p>Jangan meminta user memilih tipe ambulans atau spesialis rumah sakit.</p>`},
{id:'u-check',title:'Quick Condition Check',html:`<div class="topback">← Kembali</div><h3>Kondisi korban</h3><p class="sub">Jawab sebisanya. Pilih “Tidak tahu” jika ragu.</p><div class="card"><div class="label">Apakah korban sadar?</div><div class="row"><button class="choice">Ya</button><button class="choice selected">Tidak</button><button class="choice">Tidak tahu</button></div></div><div class="card"><div class="label">Apakah korban dapat bernapas?</div><button class="choice">Normal</button><button class="choice selected">Kesulitan</button><button class="choice">Tidak bernapas</button><button class="choice">Tidak tahu</button></div><div class="card"><div class="label">Apakah ada pendarahan?</div><button class="choice">Tidak ada</button><button class="choice">Ringan</button><button class="choice selected">Berat</button><button class="choice">Tidak tahu</button></div><label class="label">Jumlah korban</label><select class="input"><option>1 korban</option><option>2 korban</option><option>3 korban</option><option>4 korban</option><option>5+ korban</option></select><button class="big-cta">Lanjut</button>`,spec:`<h3>Quick Condition Check</h3><h4>Input</h4><ul><li>Kesadaran.</li><li>Pernapasan.</li><li>Pendarahan.</li><li>Jumlah korban.</li><li>Kelompok usia pada step berikut/opsional.</li></ul><p>Semua pertanyaan klinis wajib memiliki opsi “Tidak tahu”.</p>`},
{id:'u-contact',title:'Kontak Penolong',html:`<div class="topback">← Kembali</div><h3>Kontak penolong</h3><p class="sub">Petugas dapat menghubungi Anda jika kesulitan menemukan lokasi.</p><label class="label">Nama</label><input class="input" value="Riza"><label class="label">Nomor telepon aktif</label><input class="input" value="08xxxxxxxxxx"><label class="label">Catatan tambahan (opsional)</label><textarea class="input" rows="4" placeholder="Informasi yang perlu diketahui petugas"></textarea><button class="big-cta">Lanjut</button>`,spec:`<h3>Kontak Penolong</h3><h4>Input wajib</h4><ul><li>Nama.</li><li>Nomor telepon aktif.</li></ul><h4>Input opsional</h4><ul><li>Catatan tambahan.</li></ul>`},
{id:'u-review',title:'Review Request',html:`<div class="topback">← Kembali</div><h3>Periksa sebelum dikirim</h3><div class="card"><div class="kv"><b>Lokasi</b><span>Jl. Contoh Raya</span><b>Kejadian</b><span>Kecelakaan</span><b>Kesadaran</b><span>Tidak sadar</span><b>Pernapasan</b><span>Kesulitan</span><b>Pendarahan</b><span>Berat</span><b>Korban</b><span>1 orang</span><b>Kontak</b><span>08xxxxxxxxxx</span></div></div><div class="note">Informasi ini adalah kondisi awal. Petugas ambulans akan melakukan penilaian ulang saat tiba.</div><button class="big-cta">CARI BANTUAN SEKARANG</button><button class="secondary">Ubah Informasi</button>`,spec:`<h3>Review Request</h3><p>Tujuan: mengurangi kesalahan sebelum request dikirim.</p><h4>CTA</h4><ul><li>Cari Bantuan Sekarang.</li><li>Ubah Informasi.</li></ul>`},
{id:'u-search',title:'Mencari Ambulans',html:`<h3>Mencari bantuan...</h3><p class="sub">Kami sedang mencari ambulans yang sesuai dengan kondisi awal korban.</p><div class="progress done"><div class="dot">✓</div><div class="txt"><b>Lokasi diterima</b><br><span class="muted">Jl. Contoh Raya</span></div></div><div class="progress done"><div class="dot">✓</div><div class="txt"><b>Kondisi korban diterima</b><br><span class="muted">Kecelakaan, tidak sadar, kesulitan bernapas</span></div></div><div class="progress"><div class="dot">…</div><div class="txt"><b>Mencari ambulans</b><br><span class="muted">Mencocokkan fasilitas dan jarak</span></div></div><div class="alert">Tetap bersama korban jika aman dilakukan.</div><button class="secondary">Batalkan Permintaan</button>`,spec:`<h3>Mencari Ambulans</h3><p>User tidak perlu melihat skor teknis. Tampilkan progres dengan bahasa sederhana.</p><h4>State alternatif</h4><ul><li>Unit pertama menolak → “Mencari unit lain.”</li><li>Belum ada unit → “Sistem terus mencari bantuan.”</li></ul>`},
{id:'u-assigned',title:'Ambulans Ditemukan',html:`<h3>Ambulans menuju lokasi</h3><p class="sub">Unit telah dipilih sesuai kondisi awal korban dan ketersediaan.</p><div class="hero-number">6 menit</div><div class="label">Estimasi tiba</div><div class="map">LIVE MAP<br>🚑 ─────────→ 📍</div><div class="card"><div class="value">AMB-021</div><div class="muted">Petugas: Andi & Bima</div><div style="margin-top:8px"><span class="pill">Oxygen</span><span class="pill">AED</span><span class="pill">Trauma Kit</span></div></div><button class="big-cta">Hubungi Petugas</button><button class="secondary">Bagikan Perjalanan</button>`,spec:`<h3>Ambulans Ditemukan</h3><h4>Informasi</h4><ul><li>ETA.</li><li>Kode unit.</li><li>Petugas.</li><li>Fasilitas relevan.</li><li>Live map.</li></ul>`},
{id:'u-hospital',title:'Rumah Sakit Tujuan',html:`<h3>Rumah sakit tujuan</h3><p class="sub">Petugas telah memperbarui kondisi korban. Sistem memilih fasilitas yang sesuai.</p><div class="card"><div class="value">RS ABC</div><div class="muted">11 menit dari lokasi saat ini</div><div style="margin-top:10px"><span class="pill">IGD</span><span class="pill">ICU</span><span class="pill">CT Scan</span><span class="pill">Trauma</span></div></div><div class="alert"><b>✓ RS siap menerima pasien</b><br>Informasi kondisi korban telah dikirim sebelum kedatangan.</div><div class="map">AMBULANS → RUMAH SAKIT</div>`,spec:`<h3>Rumah Sakit Tujuan</h3><p>User hanya perlu mengetahui rumah sakit tujuan, ETA, dan bahwa rumah sakit siap menerima.</p>`},
{id:'u-complete',title:'Selesai',html:`<h3>Pasien telah diterima</h3><p class="sub">Proses emergency response untuk kasus ini telah selesai.</p><div class="card"><div class="value">RS ABC</div><div class="muted">Pasien diterima • 22:18</div></div><button class="secondary">Lihat Ringkasan Kejadian</button><button class="big-cta">Kembali ke Home</button>`,spec:`<h3>Completed</h3><p>Case selesai setelah rumah sakit mengonfirmasi penerimaan pasien.</p>`}
],
ambulance:[
{id:'a-home',title:'Status Ambulans',html:`<h3>AMB-021</h3><p class="sub">Unit dan petugas ambulans</p><div class="card"><div class="label">Status</div><div class="value">AVAILABLE</div><div style="margin-top:8px"><span class="pill">Oxygen</span><span class="pill">AED</span><span class="pill">Trauma Kit</span></div></div><button class="big-cta">Mulai Menerima Request</button><button class="secondary">Set Offline</button>`,spec:`<h3>Status Ambulans</h3><p>Home role ambulans fokus pada availability dan kesiapan unit.</p>`},
{id:'a-incoming',title:'Emergency Request Baru',html:`<h3>Emergency request baru</h3><div class="hero-number">2.1 km</div><div class="label">Jarak ke korban</div><div class="card"><div class="kv"><b>Kasus</b><span>Kecelakaan</span><b>Kesadaran</b><span>Tidak sadar</span><b>Pernapasan</b><span>Kesulitan</span><b>Pendarahan</b><span>Berat</span><b>Korban</b><span>1</span></div></div><div class="card"><div class="label">Lokasi</div><div class="value">Jl. Contoh Raya, Surakarta</div><div class="muted">Patokan: depan minimarket</div></div><div class="row"><button class="secondary">Tolak</button><button class="big-cta">Terima</button></div>`,spec:`<h3>Incoming Request</h3><h4>Petugas melihat</h4><ul><li>Jarak/ETA.</li><li>Jenis kejadian.</li><li>Kondisi awal.</li><li>Jumlah korban.</li><li>Lokasi & patokan.</li></ul>`},
{id:'a-route',title:'Menuju Korban',html:`<h3>Menuju korban</h3><div class="map">NAVIGATION MAP<br>🚑 ─────────→ 📍</div><div class="card"><div class="hero-number">5 menit</div><div class="label">ETA</div><div class="value">Riza • 08xxxxxxxxxx</div></div><button class="big-cta">Saya Sudah Tiba</button><button class="secondary">Hubungi Penolong</button>`,spec:`<h3>Menuju Korban</h3><p>Petugas membutuhkan map, ETA, identitas kontak, dan satu CTA status yang jelas.</p>`},
{id:'a-assess1',title:'Assessment Korban',html:`<h3>Assessment korban</h3><p class="sub">Perbarui kondisi korban berdasarkan pemeriksaan di lokasi.</p><div class="card"><div class="label">Kesadaran</div><button class="choice">Sadar penuh</button><button class="choice">Respons menurun</button><button class="choice selected">Tidak sadar</button></div><div class="card"><div class="label">Pernapasan</div><button class="choice">Normal</button><button class="choice selected">Kesulitan</button><button class="choice">Tidak bernapas</button></div><button class="big-cta">Lanjut</button>`,spec:`<h3>Assessment Step 1</h3><h4>Input</h4><ul><li>Kesadaran.</li><li>Pernapasan.</li></ul><p>Assessment dipisah menjadi beberapa layar agar cepat dan tidak membebani petugas.</p>`},
{id:'a-assess2',title:'Cedera & Pendarahan',html:`<h3>Kondisi lanjutan</h3><div class="card"><div class="label">Pendarahan</div><button class="choice">Tidak ada</button><button class="choice">Ringan</button><button class="choice selected">Berat</button></div><div class="label">Area cedera</div>${['Kepala','Leher','Dada','Perut','Punggung','Lengan','Kaki','Luka bakar','Lainnya'].map((x,i)=>`<label class="checkbox"><input type="checkbox" ${i===0?'checked':''}> ${x}</label>`).join('')}<button class="big-cta">Lanjut</button>`,spec:`<h3>Assessment Step 2</h3><h4>Input</h4><ul><li>Pendarahan.</li><li>Multi-select area cedera.</li><li>Kondisi khusus opsional di step berikutnya.</li></ul>`},
{id:'a-summary',title:'Ringkasan Assessment',html:`<h3>Ringkasan kondisi</h3><div class="card"><div class="kv"><b>Kesadaran</b><span>Tidak sadar</span><b>Pernapasan</b><span>Kesulitan</span><b>Pendarahan</b><span>Berat</span><b>Cedera</b><span>Kepala</span><b>Catatan</b><span>—</span></div></div><div class="note">Gunakan data ini untuk mencari rumah sakit dengan fasilitas yang sesuai.</div><button class="big-cta">Cari Rumah Sakit</button><button class="secondary">Ubah Assessment</button>`,spec:`<h3>Assessment Summary</h3><p>Petugas dapat mengecek ulang sebelum hospital matching dijalankan.</p>`},
{id:'a-hospital-search',title:'Mencari Rumah Sakit',html:`<h3>Mencari rumah sakit...</h3><div class="progress done"><div class="dot">✓</div><div class="txt"><b>Kondisi korban diperbarui</b></div></div><div class="progress done"><div class="dot">✓</div><div class="txt"><b>Kebutuhan fasilitas ditentukan</b></div></div><div class="progress"><div class="dot">…</div><div class="txt"><b>Mengecek rumah sakit yang sesuai</b><br><span class="muted">Mempertimbangkan fasilitas, jarak, dan kesiapan menerima pasien</span></div></div>`,spec:`<h3>Hospital Matching</h3><p>Petugas tidak perlu browsing daftar RS. Sistem mengelola candidate dan konfirmasi.</p>`},
{id:'a-hospital-pending',title:'RS Terpilih',html:`<h3>Rumah sakit terpilih</h3><div class="card"><div class="value">RS ABC</div><div class="muted">6.2 km • ETA 11 menit</div><div style="margin-top:10px"><span class="pill">IGD</span><span class="pill">ICU</span><span class="pill">CT Scan</span><span class="pill">Trauma</span></div></div><div class="note">Dipilih karena fasilitasnya sesuai dengan kondisi korban.</div><div class="alert">Menunggu konfirmasi rumah sakit...</div>`,spec:`<h3>RS Terpilih</h3><p>Tampilkan alasan pemilihan dalam bahasa manusia, bukan score teknis.</p>`},
{id:'a-hospital-accepted',title:'RS Siap Menerima',html:`<h3>RS siap menerima pasien</h3><div class="card"><div class="value">✓ RS ABC</div><div class="muted">Siap menerima • ETA 11 menit</div></div><div class="map">RUTE KE RUMAH SAKIT<br>🚑 ─────────→ 🏥</div><button class="big-cta">Mulai Perjalanan</button>`,spec:`<h3>Hospital Accepted</h3><p>Setelah RS menerima, petugas dapat langsung memulai perjalanan.</p>`},
{id:'a-rejected',title:'RS Menolak → Auto Re-route',html:`<h3>Mencari tujuan alternatif</h3><div class="alert">RS ABC belum dapat menerima pasien.</div><div class="progress done"><div class="dot">✓</div><div class="txt"><b>Assessment tetap tersimpan</b></div></div><div class="progress"><div class="dot">…</div><div class="txt"><b>Mencari rumah sakit alternatif</b></div></div><div class="note">Petugas tidak perlu mengisi ulang assessment.</div>`,spec:`<h3>Auto Re-route</h3><p>Penolakan RS bukan dead-end. Sistem langsung melanjutkan ke candidate berikutnya.</p>`},
{id:'a-handover',title:'Handover',html:`<h3>Tiba di rumah sakit</h3><div class="card"><div class="value">RS B</div><div class="muted">Ambulans tiba • 22:15</div></div><div class="card"><div class="label">Ringkasan pasien</div><div class="kv"><b>Kesadaran</b><span>Tidak sadar</span><b>Pernapasan</b><span>Kesulitan</span><b>Pendarahan</b><span>Berat</span><b>Cedera</b><span>Kepala</span></div></div><button class="big-cta">Serahkan Pasien</button>`,spec:`<h3>Handover</h3><p>Setelah petugas menyerahkan pasien, case menunggu konfirmasi penerimaan dari role hospital.</p>`}
],
hospital:[

let role='user',index=0;
const labels={user:'User / Penolong',ambulance:'Petugas Ambulans',hospital:'Petugas Rumah Sakit'};
function renderFlowList(){const list=document.getElementById('flowList');list.innerHTML='';flows[role].forEach((f,i)=>{const b=document.createElement('button');b.className='flow-item'+(i===index?' active':'');b.textContent=(i+1)+'. '+f.title;b.onclick=()=>{index=i;render()};list.appendChild(b)})}
function render(){const f=flows[role][index];document.getElementById('screenTitle').textContent=f.title;document.getElementById('roleTag').textContent=labels[role];document.getElementById('phoneScreen').innerHTML=f.html;document.getElementById('specPanel').innerHTML=f.spec+`<div class="section-title">Posisi dalam flow</div><div class="timeline">${index+1} / ${flows[role].length}</div>`;renderFlowList();document.getElementById('prevBtn').disabled=index===0;document.getElementById('nextBtn').disabled=index===flows[role].length-1}
document.querySelectorAll('.role-btn').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.role-btn').forEach(x=>x.classList.remove('active'));btn.classList.add('active');role=btn.dataset.role;index=0;render()});
document.getElementById('prevBtn').onclick=()=>{if(index>0){index--;render()}};document.getElementById('nextBtn').onclick=()=>{if(index<flows[role].length-1){index++;render()}};render();
</script>
